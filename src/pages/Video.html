<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Video Player</title>
    <script src="../scripts/global/ThemePreload.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .container {
            text-align: center;
			padding: 40px;
			background-color: white;
			border-radius: 20px;
			box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }
        .video-container {
            margin-bottom: 20px;
        }
        .video-preview {
            width: 560px;
            height: 315px;
            max-width: 100%;
            position: relative;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            background-color: #000;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            outline: none;
            user-select: none;
        }
        .video-preview:hover, .video-preview:focus-visible {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
        }
        .video-thumbnail {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            background-color: #1a1a1a;
        }
        .video-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.6) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            transition: background 0.2s ease;
        }
        .video-preview:hover .video-overlay, .video-preview:focus-visible .video-overlay {
            background: linear-gradient(180deg, rgba(0,0,0,0.05) 0%, rgba(0,0,0,0.7) 100%);
        }
        .play-button-wrapper {
            transition: transform 0.2s ease, filter 0.2s ease;
            filter: drop-shadow(0 4px 12px rgba(0,0,0,0.4));
        }
        .video-preview:hover .play-button-wrapper, .video-preview:focus-visible .play-button-wrapper {
            transform: scale(1.12);
        }
        .video-watch-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #ffffff;
            font-size: 0.95em;
            font-weight: 600;
            background: rgba(0, 0, 0, 0.55);
            padding: 8px 18px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(6px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            transition: background 0.2s ease;
        }
        .video-preview:hover .video-watch-badge, .video-preview:focus-visible .video-watch-badge {
            background: rgba(0, 0, 0, 0.75);
        }
		button {
			background-color: #1abc9c;
			color: white;
			border: none;
			padding: 12px 24px;
			border-radius: 5px;
			cursor: pointer;
			font-size: 1em;
			transition: all 0.3s ease;
		}
		button:hover {
			background-color: #16a085;
			transform: translateY(-2px);
			box-shadow: 0 5px 15px rgba(0,0,0,0.1);
		}
		footer {
			position: fixed;
			bottom: 0;
			width: 100%;
			display: flex;
			justify-content: center;
			padding: 20px 0;
			background-color: #fff;
			box-shadow: 0 -5px 20px rgba(0,0,0,0.05);
		}
		.scale {
			display: flex;
			width: 80%;
			max-width: 1200px;
			justify-content: center;
		}
		.scale div {
			flex: 1;
			height: 20px;
			margin: 0 2px;
			background-color: #ecf0f1;
			transition: background-color 0.3s;
			border-radius: 10px;
		}
		.scale div.filled {
			background-color: #2ecc71;
		}
		.scale div.reward {
			background-color: #16a085;
			position: relative;
		}
		.scale div.reward::after {
        content: '?';
        position: absolute;
        top: 45%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #fff;
        font-weight: bold;
    }
	/* Dark theme styles */
	.dark-theme {
			background-color: #2c3e50;
		}
		.dark-theme .container {
			background-color: #333;
		}
		.dark-theme h1, .dark-theme h2, .dark-theme .quote {
			color: #ecf0f1;
