<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Redirector</title>
    <script src="../scripts/global/ThemePreload.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            width: 300px;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff;
            color: #333333;
        }

        .container {
            text-align: center;
            padding: 16px 18px;
            width: 100%;
            background-color: #ffffff;
        }

        h2 {
            color: #2c3e50;
            margin: 0 0 12px 0;
            font-size: 1.25em;
            font-weight: 600;
        }

        input[type="text"] {
            width: 100%;
            padding: 8px 12px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            background-color: #ffffff;
            color: #333333;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="text"]:focus {
            border-color: #1abc9c;
            box-shadow: 0 0 0 2px rgba(26, 188, 156, 0.2);
        }

        input[type="text"]::placeholder {
            color: #999999;
        }

        button {
            width: 100%;
            padding: 9px 12px;
            background-color: #486684;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 8px;
            font-size: 14px;
            font-family: inherit;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background-color 0.2s, opacity 0.2s;
        }

        button:hover:not(:disabled) {
            background-color: #2c3e50;
        }

        button:disabled {
            background-color: #d1d5db;
            color: #888888;
            cursor: not-allowed;
            opacity: 0.7;
        }

        .settings-button {
            background-color: #1abc9c;
            color: white;
        }

        .settings-button:hover:not(:disabled) {
            background-color: #16a085;
        }

        .support-button {
            background-color: #f96854;
            color: white;
            margin-bottom: 0;
        }

        .support-button:hover:not(:disabled) {
            background-color: #d84231;
        }

        #alertButton {
            background-color: #A04747;
            margin-bottom: 0;
        }

        #alertButton:hover:not(:disabled) {
            background-color: #883a3a;
        }

        #message {
            margin: 6px 0;
            font-size: 13px;
            color: #2c3e50;
            min-height: 18px;
            word-break: break-word;
        }

        .separator {
            margin: 14px 0;
            border-bottom: 1px solid #e2e8f0;
        }

        /* Dark theme styles */
        html[data-theme="dark"],
        html.dark-theme,
        body.dark-theme,
        html[data-theme="dark"] body {
            background-color: #2c3e50;
            color: #ecf0f1;
        }

        html[data-theme="dark"] .container,
        body.dark-theme .container {
            background-color: #2c3e50;
        }

        html[data-theme="dark"] h2,
        body.dark-theme h2 {
            color: #ecf0f1;
        }

        html[data-theme="dark"] input[type="text"],
        body.dark-theme input[type="text"] {
            background-color: #34495e;
            color: #ecf0f1;
            border: 1px solid #4a6278;
        }

        html[data-theme="dark"] input[type="text"]:focus,
        body.dark-theme input[type="text"]:focus {
            border-color: #1abc9c;
            box-shadow: 0 0 0 2px rgba(26, 188, 156, 0.3);
        }

        html[data-theme="dark"] input[type="text"]::placeholder,
        body.dark-theme input[type="text"]::placeholder {
            color: #95a5a6;
        }

        html[data-theme="dark"] button,
        body.dark-theme button {
            background-color: #16a085;
        }

        html[data-theme="dark"] button:hover:not(:disabled),
        body.dark-theme button:hover:not(:disabled) {
            background-color: #1abc9c;
        }

        html[data-theme="dark"] button:disabled,
        body.dark-theme button:disabled {
            background-color: #3b4e61;
            color: #7f8c8d;
            opacity: 0.6;
        }

        html[data-theme="dark"] #alertButton,
        body.dark-theme #alertButton {
            background-color: #A04747;
        }

        html[data-theme="dark"] #alertButton:hover:not(:disabled),
        body.dark-theme #alertButton:hover:not(:disabled) {
            background-color: #b55252;
        }

        html[data-theme="dark"] .settings-button,
        body.dark-theme .settings-button {
            background-color: #1abc9c;
        }

        html[data-theme="dark"] .settings-button:hover:not(:disabled),
        body.dark-theme .settings-button:hover:not(:disabled) {
            background-color: #16a085;
        }

        html[data-theme="dark"] .support-button,
        body.dark-theme .support-button {
            background-color: #f96854;
        }

        html[data-theme="dark"] .support-button:hover:not(:disabled),
        body.dark-theme .support-button:hover:not(:disabled) {
            background-color: #d84231;
        }

        html[data-theme="dark"] .separator,
        body.dark-theme .separator {
            border-bottom: 1px solid #3d566e;
        }

        html[data-theme="dark"] #message,
        body.dark-theme #message {
            color: #ecf0f1;
        }
    </style>
	<link rel="stylesheet" href="../assets/css/all.min.css">
</head>
<body>
    <div class="container">
        <h2></h2>
		<div class="separator"></div>
        <input type="text" id="domainInput" placeholder="*domain_name*">
        <button id="addDomainBtn" disabled></button>
        <button id="deleteDomainBtn" disabled></button>
        <p id="message"></p>
        <div class="separator"></div>
        <button id="alertButton"></button>
        <div class="separator"></div>
		<button class="settings-button" id="settingsButton">
            <i class="fas fa-info-circle"></i><span></span>
        </button>
        <button class="support-button" id="supportButton">
            <i class="fas fa-heart"></i><span></span>
        </button>
    </div>

	<script src="../scripts/global/ThemeController.js"></script>
    <script src="../scripts/PopupMenu.js"></script>
</body>
</html>
